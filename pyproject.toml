[project]
name = "yoto-dev-tools"
version = "0.1.0"
description = "yoto: a CLI for the Yoto API, for humans and machines"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
    "typer-verbose>=0.1.2",
    "rich>=15.0.0",
    "httpx>=0.28",
    "paho-mqtt>=2.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "fastmcp>=3.4.7",
]

[project.scripts]
yoto = "yoto.adapters.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yoto"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "pytest>=8.4",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: adapter tests against respx/fake paho (offline, fast)",
    "live: hits the real Yoto API/MQTT; needs YOTO_LIVE=1 and real credentials",
]
